[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "speechforge"
version = "0.1.0"
description = "Zero-shot voice cloning with an honest evaluation harness"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

# The core install is deliberately light: audio handling, metrics, and the
# evaluation maths only. Synthesis backends each drag in torch and a different
# pinned transformers, so they are optional extras — you should be able to
# score a directory of wav files without installing a TTS stack at all.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Evaluation. speechlens supplies the ASR (faster-whisper), WER, and all of the
# confidence/calibration machinery already validated in the other project.
eval = [
    "speechlens @ git+https://github.com/shaostassen/voice_detection_using_machine_learning.git",
]

# Synthesis backends. Chatterbox pins torch==2.6.0 exactly; install with
#   --index-url https://download.pytorch.org/whl/cpu
# on a machine without a GPU, or pip pulls ~2.5 GB of unusable CUDA wheels.
chatterbox = ["chatterbox-tts>=0.1.7"]

# Piper is GPL-3.0-or-later (the MIT rhasspy/piper was archived 2025-10). It is an
# optional extra and is invoked as a subprocess rather than imported, so a plain
# install of this package pulls in no GPL code. See docs/LICENSES.md. Voices are
# licensed separately and download on their own:
#   python3 -m piper.download_voices en_US-lessac-medium
piper = ["piper-tts>=1.3"]

# StyleTTS 2 — the diffusion backend. Not on PyPI: clone yl4579/StyleTTS2 (MIT)
# and point STYLETTS2_REPO at it; see speechforge/backends/styletts2.py. Install
# CPU torch first, as for Chatterbox. `phonemizer` is GPL-3.0-or-later and is
# invoked through its `phonemize` CLI as a subprocess, never imported, exactly
# like Piper; it needs the espeak-ng system package. Also needs NLTK's punkt_tab:
#   python -m nltk.downloader punkt_tab
styletts2 = [
    "torch>=2.1", "torchaudio>=2.1", "transformers>=4.40,<4.50",
    "librosa>=0.10", "munch>=4.0", "einops>=0.7", "einops-exts>=0.0.4",
    "nltk>=3.8", "pyyaml>=6.0", "phonemizer>=3.2",
]

# Speaker similarity and predicted MOS both need torch.
similarity = ["torch>=2.0", "torchaudio>=2.0", "transformers>=4.40"]

[tool.setuptools.packages.find]
include = ["speechforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
